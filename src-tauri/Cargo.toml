[package]
name = "app"
description = "Richochet desktop shell: the window, the IPC surface and the Win32 clipboard."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdcore.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"

# Auto-update. The updater plugin pings the manifest URL in tauri.conf.json
# (plugins.updater.endpoints) and refuses anything not signed by the matching private key. The
# process plugin is its partner: it provides the relaunch that completes a Windows install.
tauri-plugin-updater = "2.11"
tauri-plugin-process = "2.3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
# Only to name the process holding the clipboard when it will not open (clipboard/open.rs).
# Already in the tree through Tauri, so this adds no new crate.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
arboard = "3.6"
