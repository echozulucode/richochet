[workspace]
members = ["crates/mdcore", "crates/mdcli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
authors = ["Eric Zimmerman"]
repository = "https://github.com/echozulucode/richochet"
homepage = "https://github.com/echozulucode/richochet"

[workspace.dependencies]
mdcore = { path = "crates/mdcore" }

pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
ammonia = "4.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

insta = { version = "1.48", features = ["glob"] }
proptest = "1.11"
similar-asserts = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
